[project]
name = "eai-studio"
version = "0.1.0"
description = "Load, serve, and unload large MoE models on modest hardware - a real, consumable product built on eai-poc's validated chunked-loading + fixed-budget expert cache engine."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2",
    "transformers>=4.45",
    "safetensors>=0.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
gui = ["pywebview>=5.0"]

[tool.setuptools.packages.find]
include = ["eai_studio*"]
