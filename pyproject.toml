[project]
name = "eai-poc"
version = "0.1.0"
description = "Expert Activation Index - external predictor for MoE expert routing (PoC)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2",
    "transformers>=4.45",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
include = ["eai*"]
